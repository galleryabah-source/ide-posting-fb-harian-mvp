name: Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'ide-posting-fb-harian-mvp' }}

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install current app dependencies
        run: npm install --no-audit --no-fund

      - name: Initialize vinext for Cloudflare
        run: npx vinext@latest init --skip-check --platform=cloudflare --data-cache=kv

      - name: Validate required Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VINEXT_KV_NAMESPACE_ID: ${{ secrets.VINEXT_KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$VINEXT_KV_NAMESPACE_ID" || { echo "Missing VINEXT_KV_NAMESPACE_ID"; exit 1; }
          test -n "$CLOUDFLARE_WORKER_NAME" || { echo "Missing CLOUDFLARE_WORKER_NAME"; exit 1; }

      - name: Configure Cloudflare deployment
        env:
          VINEXT_KV_NAMESPACE_ID: ${{ secrets.VINEXT_KV_NAMESPACE_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          config.name = process.env.CLOUDFLARE_WORKER_NAME;
          config.preview_urls = true;
          for (const namespace of config.kv_namespaces ?? []) {
            if (namespace.binding === 'VINEXT_KV_CACHE') {
              namespace.id = process.env.VINEXT_KV_NAMESPACE_ID;
            }
          }
          const hasKv = (config.kv_namespaces ?? []).some(
            (namespace) => namespace.binding === 'VINEXT_KV_CACHE' && namespace.id,
          );
          if (!hasKv) {
            throw new Error('VINEXT_KV_CACHE namespace is missing from wrangler.jsonc');
          }
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          NODE
          node -e "const c=require('./wrangler.jsonc'); if(c.name!==process.env.CLOUDFLARE_WORKER_NAME) process.exit(1); console.log('Worker:', c.name); console.log('KV binding configured.');"

      - name: Build Cloudflare target
        run: npm run build:vinext

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          echo "Cloudflare deployment artifact verified."

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx @vinext/cloudflare deploy
