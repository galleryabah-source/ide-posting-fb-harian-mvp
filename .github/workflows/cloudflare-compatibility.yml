name: Cloudflare Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vinext:
    name: Next.js on Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install current app dependencies
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare compatibility
        run: npx vinext@latest check

      - name: Initialize Cloudflare trial
        run: npx vinext@latest init --skip-check --platform=cloudflare

      - name: Build Cloudflare target
        run: npm run build:vinext

      - name: Verify generated Cloudflare artifacts
        shell: bash
        run: |
          test -f vite.config.ts
          test -f wrangler.jsonc
          test -f dist/server/wrangler.json
          echo "Cloudflare Workers build artifacts verified."
